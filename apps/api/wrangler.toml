name = "binturong-api"
main = "src/index.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://sfqowvpuzsqgmwlecgdx.supabase.co"

# Secrets (set via CLI, not in this file):
# wrangler secret put SUPABASE_SERVICE_KEY
# wrangler secret put SUPABASE_ANON_KEY
# wrangler secret put GROK_MAIN_API_KEY
# wrangler secret put GROK_SUB_API_KEY
# wrangler secret put GROK_NORMALIZATION_API_KEY
# wrangler secret put FRED_API_KEY
# wrangler secret put EXA_SEARCH
# wrangler secret put GEMINI_API_KEY   (daily/weekly recaps)
# Optional:
# wrangler secret put GEMINI_MODEL  (default: gemini-3.5-flash)
# wrangler secret put GEMINI_API_BASE_URL  (default: https://generativelanguage.googleapis.com/v1beta)
# wrangler secret put MAIN_AGENT_SYSTEM_PROMPT
# wrangler secret put SUB_AGENT_SYSTEM_PROMPT
# wrangler secret put SUB_AGENT_PLANNING_SYSTEM_PROMPT
# wrangler secret put GROK_WEB_SEARCH_MODEL
# wrangler secret put POLYMARKET_GAMMA_BASE_URL  (default: https://gamma-api.polymarket.com)

[[queues.producers]]
binding = "AGENT_RUNS_QUEUE"
queue = "agent-runs"

[[queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "snapshot-rebuild-queue"

[[queues.producers]]
binding = "GEOGRAPHY_QUEUE"
queue = "geography-queue"

[[queues.producers]]
binding = "RECAP_QUEUE"
queue = "recap-queue"

[[queues.consumers]]
queue = "agent-runs"

[[queues.consumers]]
queue = "snapshot-rebuild-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "snapshot-rebuild-dlq"

[[queues.consumers]]
queue = "geography-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

[[queues.consumers]]
queue = "recap-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

[triggers]
# Hourly cron for scheduled fanout. Actual per-portfolio run times are selected
# in code based on user timezone + effective runs/day setting.
# News + Polymarket fanouts piggyback on these same crons (no separate entry
# needed — they fire on every scheduled() invocation). Free plan cap: 5 crons.
crons = [
  "5 * * * *",
  "30 6 * * 2-6",
  "30 16 * * 2-6",
  "30 17 * * 2-6",
  "0 21 * * 2-6",
]
