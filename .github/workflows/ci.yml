name: CI

on:
  pull_request:
    branches: [main]

# Top-level so every job inherits it — a job-level block on check-web would
# leave check-api on the repo default.
permissions:
  contents: read

jobs:
  check-web:
    name: Web — lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web

  check-api:
    name: API — typecheck & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: node_sentiment_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: node_sentiment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U node_sentiment_test -d node_sentiment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run test:postgres
        working-directory: apps/api
        env:
          PG_SENTIMENT_TEST_URL: postgresql://node_sentiment_test:local-ci-only@127.0.0.1:5432/node_sentiment_test
