name: CI

on:
  pull_request:
    branches: [main]

# Top-level so every job inherits it — a job-level block on check-web would
# leave check-api on the repo default.
permissions:
  contents: read

jobs:
  check-web:
    name: Web — lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web

  check-api:
    name: API — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api